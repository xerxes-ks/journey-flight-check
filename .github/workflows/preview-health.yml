name: preview-health

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Approved Journey flight deployment URL
        required: true
        type: string
      expected_sha:
        description: Deployed 40-character Git commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  health:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      # Always run trusted default-branch checker code; deployment code is untrusted.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GET /api/health
        env:
          PREVIEW_URL: ${{ inputs.deployment_url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.deployment.sha }}
          REQUIRE_EXPECTED_SHA: "true"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 scripts/preview_health.py
