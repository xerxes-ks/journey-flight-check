<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>flightcheck /test</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #111; background: #f6f6f4; }
    body { max-width: 960px; margin: 24px auto; padding: 0 16px 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p.lead { color: #444; margin: 0 0 20px; }
    section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; margin: 8px 0 4px; color: #333; }
    label.inline { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    input[type="checkbox"] { width: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { margin-top: 12px; margin-right: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
    pre { background: #111; color: #e8e8e8; padding: 12px; overflow: auto; font-size: 12px; border-radius: 6px; }
    .err { color: #a11; }
    code { font-size: 0.9em; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; border: 1px solid #ccc; background: #eee; }
    .badge.ok { background: #e6f4ea; border-color: #8bc99a; color: #146c2e; }
    .badge.bad { background: #fdecea; border-color: #e8a0a0; color: #a11; }
    .clock { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .clock button { margin: 0; }
  </style>
</head>
<body>
  <h1>flightcheck test console</h1>
  <p class="lead">Synthetic flights only. Token stays in this browser. Fixture mode is <strong>on by default</strong> so Check / Track / Tick do not call AeroAPI. <span id="healthBadge" class="badge">health: …</span></p>

  <section>
    <label>Bearer token (<code>FLIGHTCHECK_TOKEN</code>)</label>
    <input id="token" type="password" autocomplete="off" />
    <button type="button" id="saveToken">Save token</button>
    <label class="inline">
      <input id="fixtures" type="checkbox" checked />
      Fixture mode (<code>X-Flightcheck-Mode: fixtures</code>) — default on
    </label>
  </section>

  <section>
    <h2>Check</h2>
    <div class="row">
      <div>
        <label>Flight</label><input id="chkFlight" value="XX123" />
        <label>Date</label><input id="chkDate" value="2027-03-15" />
        <label>Origin</label><input id="chkOrigin" value="XXA" />
      </div>
      <div>
        <label>now (ISO, fixtures only)</label>
        <input id="chkNow" value="2027-03-14T18:00:00Z" />
        <div class="clock" id="clockStepper">
          <button type="button" data-step="-360">−6h</button>
          <button type="button" data-step="-60">−1h</button>
          <button type="button" data-step="-15" id="clockMinus15">−15m</button>
          <button type="button" data-step="15" id="clockPlus15">+15m</button>
          <button type="button" data-step="60">+1h</button>
          <button type="button" data-step="360">+6h</button>
        </div>
      </div>
    </div>
    <button type="button" id="doCheck">POST /api/check</button>
    <pre id="chkOut">{}</pre>
  </section>

  <section>
    <h2>Simulate (no AeroAPI)</h2>
    <div class="row">
      <div>
        <label>Scenario</label>
        <select id="scenario">
          <option>on_time</option>
          <option>inbound_late_recovers</option>
          <option>big_delay</option>
          <option>gate_change</option>
          <option>cancelled_then_confirmed</option>
          <option>cancelled_then_reinstated</option>
          <option>diverted</option>
          <option>retimed</option>
          <option>upstream_outage</option>
        </select>
      </div>
      <div>
        <label>Flight / date / origin / STD local</label>
        <input id="simIdent" value="XX123" />
        <input id="simDate" value="2027-06-22" />
        <input id="simOrigin" value="LHR" />
        <input id="simStd" value="09:40" />
      </div>
    </div>
    <button type="button" id="runSim">Replay checkpoints</button>
    <p id="simMeta"></p>
    <pre id="simOut">{}</pre>
  </section>

  <section>
    <h2>Track</h2>
    <div class="row">
      <div>
        <label>Flight</label><input id="trFlight" value="XX123" />
        <label>Date</label><input id="trDate" value="2027-06-22" />
        <label>Origin</label><input id="trOrigin" value="LHR" />
      </div>
      <div>
        <label>Webhook URL</label><input id="trHook" value="" placeholder="https://…" />
        <label>Opaque ref</label><input id="trRef" value="test" />
        <label>Tracking id (untrack / events)</label><input id="trId" value="" />
      </div>
    </div>
    <button type="button" id="doTrack">POST /api/track</button>
    <button type="button" id="doList">GET /api/tracked</button>
    <button type="button" id="doEvents">GET events</button>
    <button type="button" id="doUntrack">Untrack</button>
    <button type="button" id="doTick">POST /api/tick</button>
    <pre id="trOut">{}</pre>
  </section>

  <section>
    <h2>Webhook sink inbox</h2>
    <p>Last deliveries captured by <code>GET /api/webhook-sink</code>.</p>
    <button type="button" id="doSink">Refresh inbox</button>
    <pre id="sinkInbox">{}</pre>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    const tokenKey = "flightcheck_token";
    $("token").value = localStorage.getItem(tokenKey) || "";
    if (!$("trHook").value) $("trHook").value = location.origin + "/api/webhook-sink";
    $("saveToken").onclick = () => {
      localStorage.setItem(tokenKey, $("token").value.trim());
    };
    function headers() {
      const t = $("token").value.trim();
      const h = { "Authorization": "Bearer " + t, "Content-Type": "application/json" };
      if ($("fixtures").checked) h["X-Flightcheck-Mode"] = "fixtures";
      return h;
    }
    async function show(el, fn) {
      try {
        const data = await fn();
        $(el).textContent = JSON.stringify(data, null, 2);
        $(el).classList.remove("err");
        return data;
      } catch (e) {
        $(el).textContent = String(e);
        $(el).classList.add("err");
      }
    }
    async function api(path, opts) {
      const res = await fetch(path, opts);
      const text = await res.text();
      let body;
      try { body = JSON.parse(text); } catch { body = { raw: text }; }
      if (!res.ok) throw new Error(res.status + " " + JSON.stringify(body));
      return body;
    }
    $("doCheck").onclick = () => show("chkOut", () => api("/api/check", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        flight: $("chkFlight").value,
        date: $("chkDate").value,
        origin: $("chkOrigin").value,
        now: $("chkNow").value || undefined,
      }),
    }));
    $("runSim").onclick = () => show("simOut", async () => {
      const body = await api("/api/simulate", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          scenario: $("scenario").value,
          flight: $("simIdent").value,
          date: $("simDate").value,
          origin: $("simOrigin").value,
          std_local: $("simStd").value,
        }),
      });
      $("simMeta").textContent = "calls_total=" + (body.calls_total || 0) + " steps=" + ((body.timeline || []).length);
      return body;
    });
    $("doTrack").onclick = () => show("trOut", async () => {
      const body = await api("/api/track", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          flight: $("trFlight").value,
          date: $("trDate").value,
          origin: $("trOrigin").value,
          webhook_url: $("trHook").value,
          ref: $("trRef").value,
          now: $("chkNow").value || undefined,
        }),
      });
      if (body.tracking_id) $("trId").value = body.tracking_id;
      return body;
    });
    $("doList").onclick = () => show("trOut", () => api("/api/tracked", { headers: headers() }));
    $("doEvents").onclick = () => show("trOut", () => api("/api/tracked/" + encodeURIComponent($("trId").value) + "/events", { headers: headers() }));
    $("doUntrack").onclick = () => show("trOut", () => api("/api/untrack", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ tracking_id: $("trId").value }),
    }));
    $("doTick").onclick = () => show("trOut", () => api("/api/tick", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ now: $("chkNow").value || undefined }),
    }));
    $("doSink").onclick = () => show("sinkInbox", () => api("/api/webhook-sink", { headers: headers() }));
    document.querySelectorAll("#clockStepper button").forEach((btn) => {
      btn.onclick = () => {
        const minutes = Number(btn.getAttribute("data-step") || 0);
        const raw = $("chkNow").value.trim() || new Date().toISOString();
        const t = new Date(raw);
        if (Number.isNaN(t.getTime())) return;
        t.setUTCMinutes(t.getUTCMinutes() + minutes);
        $("chkNow").value = t.toISOString().replace(/\.\d{3}Z$/, "Z");
      };
    });
    (async () => {
      const badge = $("healthBadge");
      try {
        const res = await fetch("/api/health");
        const body = await res.json();
        const bits = ["health", body.ok ? "ok" : "down", body.storage, (body.sha || "").slice(0, 7)].filter(Boolean);
        badge.textContent = bits.join(" · ");
        badge.classList.add(body.ok ? "ok" : "bad");
      } catch (e) {
        badge.textContent = "health: unreachable";
        badge.classList.add("bad");
      }
    })();
  </script>
</body>
</html>
