[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightcheck"
version = "0.1.0"
description = "General-purpose flight status, delay prediction, and connection-risk scoring."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
flightcheck = "flightcheck.cli:main"

[tool.setuptools.packages.find]
include = ["flightcheck*"]

[tool.vercel]
entrypoint = "api.check:handler"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
