[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightcheck"
version = "0.1.0"
description = "General-purpose flight status, delay prediction, and connection-risk scoring."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
flightcheck = "flightcheck.cli:main"

[tool.setuptools.packages.find]
include = ["flightcheck*"]

[tool.setuptools.package-data]
flightcheck = ["fixtures/aeroapi/*.json"]

# Do NOT set [tool.vercel] entrypoint. That switch makes Vercel treat the
# project as one Python app and serve every /api/* path with a single handler
# (prod: api.check:handler, so /api/health and cron /api/tick returned 401).
# Each api/*.py file is its own function (BaseHTTPRequestHandler `handler`).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
